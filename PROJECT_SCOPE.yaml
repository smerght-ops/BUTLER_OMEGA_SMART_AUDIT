---
metadata:
  project: "BUTLER_OMEGA"
  version: "1.0"
  created: "2026-08-04"
  scope_version: "1.0"
  source_gitignore: ".gitignore"

# ---- Production -----------------------------------------------------------+
# Каталог, являющийся частью работающего Butler.
# Назначается только по явной документации или конфигурации (system_manifest.json).
# Раздел заполняется только после утверждённого инженерного аудита.
production: []

# ---- Engineering ----------------------------------------------------------+
# Инженерная инфраструктура: документация, тесты, инструменты, скрипты.
# Раздел заполняется только после утверждённого инженерного аудита.
engineering: []

# ---- Workspace ------------------------------------------------------------+
# Рабочие материалы проекта: черновики, временные данные, эксперименты.
workspace: []

# ---- Laboratory -----------------------------------------------------------+
# Исследовательские каталоги и песочницы (прототипы, PoC, тестовые среды).
laboratory:
  - name: "_AGENT_CORE_LAB"
    reason: "Git-ignore section 'Local Laboratory' прямо подтверждает назначение как лаборатория."

# ---- Archive --------------------------------------------------------------+
# Исторические данные и бэкапы. Каталог должен присутствовать в истории Git,
# но не является источником актуальной архитектуры системы.
