    reason: "Экспорт аудита (раздел 'Local Audit Exports' .gitignore)."

# ---- Generated ------------------------------------------------------------+
# Генерируемые объекты при запуске и тестировании. Не являются частью проекта.
generated:
  - name: "__pycache__"
    reason: "Кэш выполнения Python (PEP 3147, PEP 578 — .gitignore 'Python Runtime & Caches')."
  - name: ".venv"
    reason: "Виртуальное окружение Python (стандарт изоляции .gitignore)."

# ---- Ignore ---------------------------------------------------------------+
# Полностью исключаемые файлы и каталоги. Инструменты Butler не обращаются к ним
# в любой классификации. Они не считаются частью дерева проекта.
ignore:
  - name: ".git"
    reason: "Метаданные репозитория Git — стандартная практика, не часть контента."
  - name: ".agents"
    reason: "Локальный каталог IDE/Agent service (раздел 'Local Service Folders' .gitignore)."
  - name: ".codex"
    reason: "Кодовая генерация tooling — Local Service Folder (.gitignore раздел)."

